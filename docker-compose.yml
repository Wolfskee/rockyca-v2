services:
  postgres:
    image: postgres:16-alpine
    container_name: rockyca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rockyca
      POSTGRES_PASSWORD: rockyca_dev_password
      POSTGRES_DB: rockyca
    ports:
      - "5432:5432"
    volumes:
      - rockyca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rockyca -d rockyca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible object storage (pgsty/silo — community drop-in replacement for archived minio/minio)
  # S3 API: http://localhost:9000 | Web Console: http://localhost:9001
  s3:
    image: pgsty/silo:latest
    container_name: rockyca-s3
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rockyca_s3data:/data

volumes:
  rockyca_pgdata:
  rockyca_s3data:
